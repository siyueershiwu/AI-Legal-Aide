# GitHub Actions CI - 每次 push / PR 跑 4 件事
# 1. 后端: pip install + pytest
# 2. 前端: npm ci + vue-tsc + npm run build
# 3. Compose: docker compose config(语法验证)
# 4. Compose: docker compose build(镜像能 build 出来)

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ===== 后端: pytest =====
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          # 测试用环境变量,真实值不入 git
          SECRET_KEY: test-secret-key-for-ci-only-86-characters-long-aaaaaaaaaaaaaaaaaa
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          REDIS_URL: redis://localhost:6379/0
          DOUBAO_API_KEY: test-key
        run: pytest -v --tb=short

  # ===== 前端: type-check + build =====
  frontend:
    name: Frontend (type-check + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vue.what
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: vue.what/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build

  # ===== Compose: 语法 + build 验证 =====
  compose:
    name: Docker Compose (config + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare dummy secrets for build context
        # build 不需要真实密码,但 compose config 解析需要变量非空
        run: |
          {
            echo "MYSQL_ROOT_PASSWORD=ci_dummy_password_for_build_only"
            echo "REDIS_PASSWORD=ci_dummy"
            echo "MINIO_ROOT_USER=ci_dummy_user"
            echo "MINIO_ROOT_PASSWORD=ci_dummy_password_for_build"
          } >> $GITHUB_ENV

      - name: docker compose config
        run: docker compose config --quiet

      - name: docker compose build
        # 只 build 验证 Dockerfile 能跑,不起容器
        run: |
          docker compose build \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            backend
        env:
          DOCKER_BUILDKIT: 1
