# GitHub Actions CI - 每次 push / PR 自动运行
# 1. 后端: pip install + pytest
# 2. 前端: npm ci + vue-tsc + npm run test + npm run build
# 3. Compose: docker compose config (语法验证)

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ===== 后端: pytest =====
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          # 测试用环境变量，真实值不入 git。SECRET_KEY 必须 ≥ 86 字符（与 backend 启动校验一致）
          SECRET_KEY: test-secret-key-for-ci-only-86-characters-long-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          REDIS_URL: "redis://localhost:6379/0"
          DOUBAO_API_KEY: test-key
        run: pytest -v --tb=short

  # ===== 前端: type-check + build =====
  frontend:
    name: Frontend (type-check + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 20.19+ or 22.12+ (package.json engines 已声明)；固定 22 避免 20.x 小版本漂移
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

  # ===== Compose: 语法验证 =====
  compose:
    name: Docker Compose (config validation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare dummy secrets
        run: |
          {
            echo "REDIS_PASSWORD=ci_dummy"
            echo "MINIO_ROOT_USER=ci_dummy_user"
            echo "MINIO_ROOT_PASSWORD=ci_dummy_password_for_build"
          } >> $GITHUB_ENV

      - name: docker compose config (dev)
        run: docker compose config

      - name: docker compose config (prod)
        env:
          # 真实值不入 git。SECRET_KEY ≥ 86 字符（与 backend 启动校验一致）
          SECRET_KEY: ci_dummy_secret_key_for_config_validation_only_86_chars_long_aaaaaaaaaaaaaaaaaaaaaaaaaaa
          MYSQL_ROOT_PASSWORD: ci_dummy_mysql
          MYSQL_DATABASE: testdb
          MYSQL_PORT: "3306"
          DOUBAO_API_KEY: ci_dummy
          DOUBAO_BASE_URL: https://example.com
          DOUBAO_MODEL: test-model
          BACKEND_PORT: "8000"
        run: docker compose -f docker-compose.prod.yml config
