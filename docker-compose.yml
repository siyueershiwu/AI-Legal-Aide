# Docker Compose - 本地开发环境（带热更新、源码挂载）
# 使用: docker compose -f docker-compose.yml -f docker-compose.override.yml up -d
# 生产环境: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# 必须环境变量（强烈建议复制 .env.example.docker 为 .env 放在仓库根）:
# MYSQL_ROOT_PASSWORD / MINIO_ROOT_USER / MINIO_ROOT_PASSWORD
# DOUBAO_BASE_URL（一般不用改）
# 后端应用自己的 SECRET_KEY / DATABASE_URL / REDIS_URL / MINIO_* / DOUBAO_API_KEY
#   来自 backend/.env（env_file 已挂载）。

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    container_name: chat-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: mysql+aiomysql://root:${MYSQL_ROOT_PASSWORD:-rootpass}@mysql:3306/chat_db
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      DOUBAO_BASE_URL: ${DOUBAO_BASE_URL:-https://ark.cn-beijing.volces.com/api/v3}
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - chat-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ===== 前端 Vue (dev with HMR) =====
  frontend:
    image: node:20-alpine
    container_name: chat-frontend
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    volumes:
      - ./vue.what:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    networks:
      - chat-net

  # ===== MySQL =====
  mysql:
    image: mysql:8.0
    container_name: chat-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: chat_db
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - chat-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-rootpass}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ===== Redis =====
  redis:
    image: redis:7-alpine
    container_name: chat-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - chat-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ===== MinIO =====
  minio:
    image: minio/minio:latest
    container_name: chat-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - chat-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ===== Nginx 反向代理（生产 HTTPS）=====
  # 默认注释。启用见 README "Nginx + HTTPS" 章节。
  #
  # nginx:
  #   image: nginx:1.27-alpine
  #   container_name: chat-nginx
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
  #     - /etc/letsencrypt:/etc/letsencrypt:ro
  #     - ./certbot/www:/var/www/certbot:ro
  #   depends_on:
  #     - backend
  #     - frontend
  #   networks:
  #     - chat-net

volumes:
  mysql-data:
  redis-data:
  minio-data:
  frontend_node_modules:

networks:
  chat-net:
    driver: bridge
