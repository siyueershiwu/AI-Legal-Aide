# ===== 开发环境基础设施 =====
# 仅包含 Redis 和 MinIO。MySQL 使用本地安装（不在 Docker 中）。
#
# 启动: docker compose up -d
# 停止: docker compose down
# 查看: docker compose ps
#
# MinIO 控制台: http://localhost:9001
# Redis:         localhost:6379

services:
  # ---- Redis (with password) ----
  redis:
    image: redis:7-alpine
    container_name: what-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?err}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?err}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---- MinIO (S3-compatible storage) ----
  minio:
    image: minio/minio:latest
    container_name: what-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?err}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?err}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  redis_data:
  minio_data:
